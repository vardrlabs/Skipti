# JVM for Gradle itself. JAVA_HOME (Studio's own JBR) is exported by the
# Makefile: the one JDK this project is built with anywhere.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
# (written by Android Studio's sync, 2026-09-19; it affects only the IDE's own
# sync through the tooling API, never a command-line build, D-140)
org.gradle.tooling.parallel=true

# Never download a JDK (D-140). Android Studio's sync generated a daemon-JVM
# criteria file with foojay.io download URLs; with macOS scanning switched
# off for internal testing (CLAUDE.md §13), a downloaded JDK would run
# unscanned. The one JDK this project builds with is the JAVA_HOME above;
# if a build ever needs another, it must fail loudly, not fetch one.
org.gradle.java.installations.auto-download=false
