distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
# Published by Gradle at <distributionUrl>.sha256. D-91 already CLAIMED this
# wrapper was checksum-pinned; it was not. `validateDistributionUrl` checks
# the URL, never the bytes. Without this line the wrapper executes whatever
# the download produced. Verification limit, stated: ONE source (Gradle's own
# published digest). The local dist cache keeps no zip to cross-check against,
# so this is not the two-source agreement D-15 requires of KAT constants.
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
