[package]
name = "skipti-core"
version = "0.3.0"
edition.workspace = true
license.workspace = true

[lib]
name = "skipti_core"
# staticlib feeds the iOS XCFramework (D-44); cdylib feeds uniffi-bindgen
# and wasm; rlib is the workspace-internal shape.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
sha2 = "0.10"
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }

# Android (D-91): off-Apple there is no CommonCrypto branch, so SQLCipher's
# codec needs OpenSSL. VENDORED, target-scoped to the two android triples.
# Apple targets keep the proven CommonCrypto path byte-for-byte. Static
# link: no .so/.a sidecar for the shell to mis-version.
[target.aarch64-linux-android.dependencies]
rusqlite = { version = "0.40", features = [
    "bundled-sqlcipher",
    "bundled-sqlcipher-vendored-openssl",
] }

[target.x86_64-linux-android.dependencies]
rusqlite = { version = "0.40", features = [
    "bundled-sqlcipher",
    "bundled-sqlcipher-vendored-openssl",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
